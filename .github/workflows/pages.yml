# Publishes the landing page to GitHub Pages. See docs/operations.md (Deploy).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time, and a deploy in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check docs
        run: node scripts/check-docs.mjs

      # The landing loads the skill's own snippets (docs/decisions.md, D7), so both are
      # published together and the relative path is rewritten for the site root.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r skills _site/skills
          cp .github/assets/social-preview.png _site/og.png
          sed -i 's#\.\./skills/#./skills/#g' _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
